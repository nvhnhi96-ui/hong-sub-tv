<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hóng Sub TV</title>
<!-- Hóng Sub for LG TVs (webOS). The same file runs as the installed app (.ipk) and as a page in the TV's web browser
     (honggame.store/lg). Plain ES5 and XMLHttpRequest so it also runs on older TVs (webOS 3, Chromium 38). -->
<style>
@font-face{font-family:'HS';font-weight:500;src:url(fonts/be-vietnam-pro-vietnamese-500-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'HS';font-weight:500;src:url(fonts/be-vietnam-pro-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'HS';font-weight:700;src:url(fonts/be-vietnam-pro-vietnamese-700-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'HS';font-weight:700;src:url(fonts/be-vietnam-pro-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0E1014;color:#F4F5F7;font-family:'HS','Be Vietnam Pro',Arial,sans-serif;-webkit-font-smoothing:antialiased;cursor:default}
*{box-sizing:border-box}
#tvin{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;object-fit:contain}

/* the welcome screen, shown until there is a picture from the game console */
#home{position:fixed;left:0;top:0;width:100%;height:100%;padding:7.5vh 8vw;background:#0E1014;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#home.off{display:none}
.brand{font-weight:700;font-size:3.2vh;letter-spacing:-.01em}
.brand b{background:#FFC400;color:#0E1014;border-radius:.4em;padding:.05em .32em;margin-left:.12em}
.brand small{font-weight:500;color:#8A93A3;font-size:.62em;margin-left:.8em}
.homeMain{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.codeWrap .lab{font-size:2.6vh;color:#8A93A3;margin:0 0 1.6vh}
.code{display:-webkit-flex;display:flex}
.code span{display:block;width:8.6vh;height:11vh;line-height:11vh;margin-right:1.4vh;border-radius:1.6vh;background:#FFC400;color:#0E1014;font-weight:700;font-size:7.4vh;text-align:center}
.steps{margin:5vh 0 0;padding:0;list-style:none;font-size:2.7vh;line-height:1.5;color:#C9CED8;max-width:60vw}
.steps li{margin:0 0 1.2vh}
.steps b{color:#F4F5F7}
.homeFoot{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:2.2vh;color:#8A93A3}
.dot{width:1.3vh;height:1.3vh;border-radius:50%;background:#8A93A3;margin-right:1vh}
.dot.ok{background:#3FD08A}
.dot.bad{background:#FF6B5E}
.homeFoot .sp{-webkit-flex:1;flex:1}
.key{display:inline-block;border:2px solid #3A404C;border-radius:.5em;padding:0 .45em;margin:0 .3em;color:#F4F5F7;font-weight:700}

/* subtitles */
#sub{position:fixed;left:6vw;right:6vw;bottom:7vh;text-align:center;pointer-events:none;opacity:0;-webkit-transition:opacity .18s;transition:opacity .18s}
#sub.top{bottom:auto;top:6vh}
#sub.on{opacity:1}
body.pan #sub{right:40vw}
#sub .box{display:inline-block;max-width:100%;padding:.3em .7em .36em;border-radius:.4em;background:rgba(8,9,12,.78)}
#vi{font-weight:700;line-height:1.32;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#vi .who{color:#FFC400;margin-right:.3em}
#en{font-weight:500;color:#C9CED8;margin-top:.2em;line-height:1.3}

/* status line on top of the game: shown for a few seconds when something changes or a key is pressed */
#pill{position:fixed;left:3vw;top:4vh;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:1vh 1.8vh;border-radius:100px;background:rgba(14,16,20,.86);font-size:2.1vh;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s}
#pill.on{opacity:1}
#pill .k{color:#FFC400;font-weight:700;margin-left:.5em;letter-spacing:.08em}

/* settings */
#panel{position:fixed;top:0;right:0;width:37vw;min-width:560px;height:100%;background:#171A21;border-left:1px solid #262B35;padding:5vh 2.6vw;-webkit-transform:translateX(102%);transform:translateX(102%);-webkit-transition:-webkit-transform .2s;transition:transform .2s;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#panel.on{-webkit-transform:none;transform:none}
#panel h2{margin:0 0 3vh;font-size:3.2vh;font-weight:700}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;min-height:7.4vh;padding:0 2vh;margin:0 -2vh .6vh;border-radius:1.2vh;font-size:2.5vh;border:2px solid transparent}
.row .v{margin-left:auto;color:#C9CED8;font-weight:700;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.row .v:before,.row .v:after{content:'';width:0;height:0;border:.7vh solid transparent;margin:0 1.2vh;opacity:0}
.row .v:before{border-right-color:#FFC400;border-left:0}
.row .v:after{border-left-color:#FFC400;border-right:0}
.row.f{background:#232833;border-color:#FFC400}
.row.f.pick .v:before,.row.f.pick .v:after{opacity:1}
.row.f .v{color:#F4F5F7}
.row.act .v{color:#FFC400}
#panel .note{margin-top:auto;font-size:2vh;line-height:1.5;color:#8A93A3}
#panel .note b{color:#C9CED8}
</style>
</head>
<body>
<video id="tvin" autoplay></video>

<section id="home">
  <div class="brand">Hóng<b>Sub</b><small>phụ đề tiếng Việt trên TV</small></div>
  <div class="homeMain">
    <div class="codeWrap">
      <p class="lab">Mã TV</p>
      <div class="code" id="code"></div>
      <ol class="steps">
        <li>Trên máy tính, mở <b>Hóng Sub</b> và vào <b>Kết nối TV</b>.</li>
        <li>Gõ mã ở trên vào ô <b>Mã TV</b> rồi bấm <b>Gửi thử</b>.</li>
        <li>Bấm <span class="key">OK</span> trên điều khiển để chọn cổng HDMI của máy PS5: hình game sẽ hiện ở đây và phụ đề nằm trên hình.</li>
      </ol>
    </div>
  </div>
  <div class="homeFoot"><span class="dot" id="hDot"></span><span id="hState">Đang kết nối...</span><span class="sp"></span><span><span class="key">OK</span>Cài đặt</span></div>
</section>

<div id="sub"><div class="box"><div id="vi"></div><div id="en"></div></div></div>
<div id="pill"><span class="dot" id="pDot"></span><span id="pText">Hóng Sub</span><span class="k" id="pCode"></span></div>

<aside id="panel" aria-label="Cài đặt">
  <h2>Cài đặt Hóng Sub</h2>
  <div id="rows"></div>
  <p class="note" id="note"></p>
</aside>

<script>
(function(){
'use strict';
var VERSION='1.0.0';
var RELAY='https://honggame.store/wp-json/hgs-sub/v1/';
var ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var $=function(id){ return document.getElementById(id); };
var webos=/web0s|webos/i.test(navigator.userAgent);
var packaged=location.protocol==='file:';

/* ---------- settings kept on the TV ---------- */
function load(k,d){ try{ var v=localStorage.getItem('hs.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem('hs.'+k,JSON.stringify(v)); }catch(e){} }
var P={
  code:load('code',''),
  src:load('src',webos?1:0),        /* HDMI port of the console, 0 = no picture (subtitles only) */
  size:load('size',30),
  pos:load('pos','bottom'),
  en:load('en',false),
  read:load('read',true)              /* read aloud when the computer asks for it */
};
if(!/^[A-Z0-9]{6}$/.test(P.code)){ P.code=''; for(var i=0;i<6;i++) P.code+=ALPHA.charAt(Math.floor(Math.random()*ALPHA.length)); save('code',P.code); }

/* ---------- picture from the console: webOS lets an app show an HDMI input inside the page ---------- */
var video=$('tvin'), srcOk=false;
function setSource(n){
  srcOk=false;
  while(video.firstChild) video.removeChild(video.firstChild);
  if(!n){ video.style.display='none'; homeShow(); return; }
  video.style.display='block';
  var s=document.createElement('source');
  s.setAttribute('type','service/webos-external'); s.setAttribute('src','ext://hdmi:'+n);
  s.addEventListener('error',function(){ srcFail(n); });
  video.appendChild(s);
  try{ video.load(); var pr=video.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
  setTimeout(function(){ if(P.src===n&&!srcOk&&!webos) srcFail(n); },1500);
}
function srcFail(n){ if(P.src!==n) return; srcOk=false; video.style.display='none'; homeShow(); pill('HDMI '+n+' không hiện được trong app trên TV này',true); }
video.addEventListener('playing',function(){ srcOk=true; homeHide(); });
video.addEventListener('loadeddata',function(){ srcOk=true; homeHide(); });
function homeShow(){ $('home').className=''; }
function homeHide(){ $('home').className='off'; }

/* ---------- subtitles ---------- */
var hideT=0;
function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function scale(){ return Math.max(.5,Math.min(window.innerWidth/1920,window.innerHeight/1080)); }
function applyLook(){
  var px=P.size*1.6*scale();          /* the same size number as the Android TV app */
  $('vi').style.fontSize=px+'px'; $('en').style.fontSize=Math.max(16,px*.55)+'px';
  $('sub').className=($('sub').className.indexOf('on')>=0?'on ':'')+(P.pos==='top'?'top':'');
}
function showLine(who,vi,en,hold,readIt){
  $('vi').innerHTML=(who?'<span class="who">'+esc(who)+':</span>':'')+esc(vi);
  $('en').innerHTML=P.en&&en?esc(en):''; $('en').style.display=P.en&&en?'block':'none';
  $('sub').className='on'+(P.pos==='top'?' top':'');
  clearTimeout(hideT); hideT=setTimeout(function(){ $('sub').className=P.pos==='top'?'top':''; },hold);
  if(readIt) say(vi);
}

/* ---------- reading aloud: the TV's own voice, one line after another ---------- */
var sayQ=0, viVoice=null;
function pickVoice(){ try{ var v=window.speechSynthesis.getVoices(); for(var i=0;i<v.length;i++) if(/^vi/i.test(v[i].lang)){ viVoice=v[i]; return; } }catch(e){} }
if(window.speechSynthesis){ pickVoice(); try{ window.speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function luna(uri,params){ try{ var b=new window.PalmServiceBridge(); b.onservicecallback=function(){}; b.call(uri,JSON.stringify(params)); return true; }catch(e){ return false; } }
function say(t){
  if(!P.read||!t) return;
  if(window.speechSynthesis&&viVoice){
    var ss=window.speechSynthesis;
    if(ss.pending) ss.cancel();                       /* two lines already waiting: start fresh */
    var u=new SpeechSynthesisUtterance(t); u.voice=viVoice; u.lang=viVoice.lang; u.rate=ss.speaking?1.15:1.05;
    ss.speak(u); return;
  }
  luna('luna://com.webos.service.tts/speak',{text:t,language:'vi-VN',clear:false});
}
function sayStop(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} luna('luna://com.webos.service.tts/stop',{}); }

/* ---------- messages from Hóng Sub on the computer, through honggame.store ---------- */
var lastSeq=-1, okAt=0, fails=0;
function xhr(method,url,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,url,true); x.timeout=6000;
  if(body) x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){ var j=null; try{ j=JSON.parse(x.responseText); }catch(e){} cb(x.status===200?j:null); };
  x.onerror=x.ontimeout=function(){ cb(null); };
  x.send(body?JSON.stringify(body):null);
}
function hello(){ xhr('POST',RELAY+'push',{room:P.code+'T',kind:'hello',vi:'tv'},function(){}); }
function handle(j){
  var kind=j.kind||'sub', vi=String(j.vi||'').trim();
  var readIt=j.hasOwnProperty('speak')?!!j.speak:false;    /* the computer decides where lines are read */
  if(j.hasOwnProperty('speak')&&!j.speak) sayStop();
  var size=+j.size||0, pos=j.pos||'', changed=false;
  if(size>=18&&size!==P.size){ P.size=size; save('size',size); changed=true; }
  if((pos==='top'||pos==='bottom')&&pos!==P.pos){ P.pos=pos; save('pos',pos); changed=true; }
  if(changed) applyLook();
  if(kind==='hello'||kind==='ctl') return;
  if(kind==='notice'){ if(vi) showLine(j.who||'Hóng Sub',vi,'',6000,false); return; }
  if(vi) showLine(j.who||'',vi,j.en||'',Math.max(4500,Math.min(12000,vi.length*110)),readIt);
}
function poll(){
  xhr('GET',RELAY+'pull?room='+P.code+'&t='+Date.now(),null,function(j){
    var wait=450;
    if(j){
      if(!okAt||fails) netState(true); okAt=Date.now(); fails=0;
      var seq=+j.seq||0;
      if(lastSeq<0) lastSeq=seq;                       /* skip what was there before the TV started listening */
      else if(seq!==lastSeq){ lastSeq=seq; handle(j); }
    } else { if(++fails===3) netState(false); wait=2000; }
    setTimeout(poll,wait);
  });
}
function netState(ok){
  $('hDot').className='dot '+(ok?'ok':'bad'); $('pDot').className='dot '+(ok?'ok':'bad');
  $('hState').textContent=ok?'Đã sẵn sàng, đang chờ phụ đề từ máy tính':'Chưa kết nối được internet. Kiểm tra mạng của TV.';
  pill(ok?'Hóng Sub đang chờ phụ đề':'Mất kết nối internet',!ok);
}
var pillT=0;
function pill(t,keep){ if($('home').className!=='off'){ $('pill').className=''; return; }   /* the welcome screen already says it */
  $('pText').textContent=t; $('pCode').textContent='Mã '+P.code; $('pill').className='on'; clearTimeout(pillT); if(!keep) pillT=setTimeout(function(){ $('pill').className=''; },6000); }

/* ---------- settings panel: arrows to move and change, OK to open, Back to close ---------- */
var panelOn=false, fi=0, newCode=0;
var ROWS=[
  {k:'src',t:'Hình từ',v:function(){ return P.src?'HDMI '+P.src:'Không hiện hình'; },ch:function(d){ P.src=(P.src+d+5)%5; save('src',P.src); setSource(P.src); }},
  {k:'size',t:'Cỡ chữ',v:function(){ return P.size; },ch:function(d){ P.size=Math.max(18,Math.min(90,P.size+d*4)); save('size',P.size); applyLook(); sample(); }},
  {k:'pos',t:'Chỗ hiện chữ',v:function(){ return P.pos==='top'?'Trên màn hình':'Dưới màn hình'; },ch:function(){ P.pos=P.pos==='top'?'bottom':'top'; save('pos',P.pos); applyLook(); sample(); }},
  {k:'en',t:'Hiện câu gốc tiếng Anh',v:function(){ return P.en?'Bật':'Tắt'; },ch:function(){ P.en=!P.en; save('en',P.en); sample(); }},
  {k:'read',t:'Đọc to trên TV',v:function(){ return P.read?'Khi máy tính chọn':'Tắt'; },ch:function(){ P.read=!P.read; save('read',P.read); if(!P.read) sayStop(); }},
  {k:'code',t:'Mã TV',v:function(){ return newCode?'Bấm OK lần nữa để đổi':P.code; },act:function(){ if(!newCode){ newCode=1; draw(); return; } newCode=0; P.code=''; for(var i=0;i<6;i++) P.code+=ALPHA.charAt(Math.floor(Math.random()*ALPHA.length)); save('code',P.code); lastSeq=-1; codeDraw(); hello(); draw(); }},
  {k:'test',t:'Xem thử phụ đề',v:function(){ return 'OK'; },act:function(){ sample(); }},
  {k:'exit',t:'Thoát Hóng Sub',v:function(){ return 'OK'; },act:function(){ quit(); }}
];
function sample(){ showLine('KRATOS','Bám sát vào, nhóc. Cây cầu này không trụ được lâu đâu.','Stay close, boy. This bridge will not hold for long.',4000,false); }
function draw(){
  $('rows').innerHTML=ROWS.map(function(r,i){ return '<div class="row'+(i===fi?' f':'')+(r.ch?' pick':' act')+'" data-i="'+i+'"><span>'+r.t+'</span><span class="v">'+esc(r.v())+'</span></div>'; }).join('');
  [].forEach.call($('rows').children,function(el){
    el.onmouseover=function(){ fi=+el.getAttribute('data-i'); draw(); };
    el.onclick=function(){ var r=ROWS[+el.getAttribute('data-i')]; if(r.act) r.act(); else r.ch(1); draw(); };
  });
  $('note').innerHTML='Hóng Sub '+VERSION+(packaged?' cho TV LG':' trên trình duyệt')+'. Trên máy tính: <b>Kết nối TV</b>, gõ mã <b>'+P.code+'</b>.'+(packaged||!webos?'':' Trình duyệt của TV có thể không hiện được hình HDMI: cài app Hóng Sub cho LG để có hình game và phụ đề cùng lúc.');
}
function panel(on){ panelOn=on; newCode=0; $('panel').className=on?'on':''; document.body.className=on?'pan':''; if(on) draw(); }
function quit(){ sayStop(); try{ if(window.webOS&&window.webOS.platformBack) window.webOS.platformBack(); else window.close(); }catch(e){ window.close(); } }
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(!panelOn){
    if(k===13||k===457||k===404){ panel(true); e.preventDefault(); return; }    /* OK, info, green */
    if(k===461||k===27||k===8){ if($('home').className==='off'&&P.src){ pill('Bấm Back lần nữa để thoát',false); if(e.timeStamp-(window.__bk||0)<2500) quit(); window.__bk=e.timeStamp; } else quit(); e.preventDefault(); return; }
    if(k>=49&&k<=52){ P.src=k-48; save('src',P.src); setSource(P.src); pill('Hình từ HDMI '+P.src,false); return; }
    pill(okAt?'Hóng Sub đang chờ phụ đề':'Đang kết nối...',false); return;
  }
  var r=ROWS[fi];
  if(k===38){ fi=(fi+ROWS.length-1)%ROWS.length; newCode=0; }
  else if(k===40){ fi=(fi+1)%ROWS.length; newCode=0; }
  else if(k===37&&r.ch) r.ch(-1);
  else if(k===39&&r.ch) r.ch(1);
  else if(k===13){ if(r.act) r.act(); else r.ch(1); }
  else if(k===461||k===27||k===8){ panel(false); }
  else return;
  e.preventDefault(); if(panelOn) draw();
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ hello(); if(P.src) setSource(P.src); } else sayStop(); });

function codeDraw(){ $('code').innerHTML=P.code.split('').map(function(c){ return '<span>'+c+'</span>'; }).join(''); $('pCode').textContent='Mã '+P.code; }
codeDraw(); applyLook(); setSource(P.src); hello(); poll();
window.addEventListener('resize',applyLook);
window.hsTv={handle:handle,P:P,version:VERSION};
})();
</script>
</body>
</html>
