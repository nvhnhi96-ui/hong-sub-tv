<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Hóng Sub vùng dịch</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;user-select:none}
#card{position:absolute;inset:0;box-sizing:border-box;background:rgba(8,9,12,.92);border-radius:4px;border:2px solid transparent;padding:3px 7px;color:#fff;display:flex;flex-direction:column;overflow:hidden}
body:not(.move) #card{border-color:transparent!important}
#name{display:none;font-size:11.5px;font-weight:700;letter-spacing:.01em;flex:none}
body.move #name{display:block}
#tx{flex:1;min-height:0;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere;line-height:1.28;font-weight:600;text-shadow:0 1px 2px #000;display:flex;flex-direction:column;justify-content:center}
#its{position:absolute;inset:0;pointer-events:none}#its>div{position:absolute;box-sizing:border-box;color:#fff;white-space:pre;line-height:1.15;padding:0 3px;border-radius:3px;font-weight:600;text-shadow:0 1px 2px #000;overflow:hidden}
#grip{display:none;position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;-webkit-app-region:no-drag}
#grip::after{content:"";position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-right:3px solid #fff;border-bottom:3px solid #fff;opacity:.85}
body.move #card{border-style:dashed;-webkit-app-region:drag;cursor:move}
body.move #grip{display:block}
body.move #tx:empty::before{content:"Bản dịch vùng này hiện ở đây. Kéo khung tới chỗ chữ gốc, kéo góc dưới bên phải để đổi cỡ.";color:#cfd6df}
</style></head>
<body>
<div id="card"><div id="name"></div><div id="tx"></div><div id="grip" title="Kéo để đổi cỡ"></div></div><div id="its"></div>
<script>
(function(){
  var D=window.hsDesktop, card=document.getElementById('card'), nm=document.getElementById('name'), tx=document.getElementById('tx'), grip=document.getElementById('grip');
  var cur=null;
  /* "Đúng chỗ": a paragraph's Vietnamese box over its own original (it: place as parts of the area; zw, zh: the area in px).
     Never smaller than the original (the English is hidden) and centred on it; the Vietnamese keeps its lines; with the
     size read from the original the lines fit the original's height (a box never runs onto the next menu line); a longer
     line widens the box inside the area on the side the text is lined up, past that the letters get smaller. */
  function spotFit(d,it,zw,zh,al,auto){
    if(!d||!it) return;
    var bx=it.x*zw, by=it.y*zh, bw=it.w*zw, bh=it.h*zh, cx=bx+bw/2;
    var room=Math.max(bw,al==='right'?bx+bw:al==='center'?2*Math.min(cx,zw-cx):zw-bx);
    var s=d.style; s.left='0'; s.top='0'; s.minWidth='0'; s.minHeight='0'; s.maxWidth='none'; s.width='auto'; s.height='auto'; s.paddingTop=s.paddingBottom='0';
    var f=parseFloat(s.fontSize)||14;
    for(var k=0;k<5;k++){ var nh=d.offsetHeight, nw=d.offsetWidth, g=1;
      if(auto&&nh>bh*1.1) g=Math.min(g,bh*1.1/nh);
      if(nw>room) g=Math.min(g,room/nw*0.99);
      if(g>0.995||f<=5) break; f=Math.max(5,f*g); s.fontSize=f+'px'; }
    var nh2=d.offsetHeight, W=Math.min(room,Math.max(bw,d.offsetWidth)), H=Math.max(bh,nh2);
    var left=al==='right'?bx+bw-W:al==='center'?cx-W/2:bx;
    s.width=W+'px'; s.paddingTop=s.paddingBottom=((H-nh2)/2)+'px';
    s.left=Math.max(0,Math.min(zw-W,left))+'px'; s.top=(by+bh/2-H/2)+'px';
  }
  /* "Theo màu game": the box in the colours around the original text, with soft edges */
  function rgba(hex,a){ var n=parseInt(String(hex).slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  function look(el,it,a,f){ if(!it||!it.bg) return; a=1; var fe=Math.max(2,Math.round(f*0.35)), s=el.style;
    s.background=rgba(it.bg,a); s.color=it.fg||'#fff'; s.boxShadow='0 0 '+fe+'px '+Math.round(fe/2)+'px '+rgba(it.bg,a); s.textShadow='0 0 3px '+rgba(it.bg,.9); s.borderRadius=Math.round(fe/2)+'px'; }
  /* largest font (up to the chosen size) that fits the window */
  /* "Đúng chỗ từng đoạn": every paragraph of the original gets its own box at its own place in the window */
  function spots(){
    var its=document.getElementById('its'), d=cur, on=!!(d&&d.items&&d.items.length&&d.vi);
    tx.style.visibility=on?'hidden':''; card.style.background=on?'transparent':(d&&d.bg!=null?'rgba(8,9,12,'+d.bg+')':'');
    if(!on){ its.innerHTML=''; return; }
    var H=window.innerHeight, bg='rgba(8,9,12,'+(d.bg!=null?d.bg:.9)+')';
    its.innerHTML=d.items.map(function(it){
      var f=+d.px>0?(+d.px*screen.height/1080):Math.max(6,it.lh*H*0.92);
      return '<div style="left:'+(it.x*100)+'%;top:'+(it.y*100)+'%;min-width:'+(it.w*100)+'%;max-width:'+((1-it.x)*100)+'%;min-height:'+(it.h*100)+'%;font-size:'+f+'px;text-align:'+(d.al||'left')+';background:'+bg+'">'+String(it.vi).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</div>';
    }).join('');
    if(d.font) its.style.fontFamily=d.font;
    [].forEach.call(its.children,function(el,i){ spotFit(el,d.items[i],window.innerWidth,H,d.al||'left',!(+d.px>0)); look(el,d.items[i],d.bg!=null?d.bg:.9,parseFloat(el.style.fontSize)||14); });   /* the same rules as on the TV */
  }
  function fit(){
    if(!cur) return;
    /* as big as the area allows (up to the chosen size), smaller for long text, never spilling out of the area */
    var lines=(tx.textContent||'').split('\n').length, cap=Math.round((cur.size||17)*1.6);
    var f=+cur.px>0?Math.round(+cur.px*screen.height/1080):Math.max(9,Math.min(cap,Math.floor(tx.clientHeight/lines*0.7))); tx.style.fontSize=f+'px';   /* a chosen size, or as big as fits */
    while(f>8&&(tx.scrollHeight>tx.clientHeight+1||tx.scrollWidth>tx.clientWidth+1)){ f--; tx.style.fontSize=f+'px'; }
  }
  D.onZone(function(d){
    cur=d; card.style.borderColor=d.c; nm.style.color=d.c;
    if(d.bg!=null) card.style.background='rgba(8,9,12,'+d.bg+')'; if(d.font) tx.style.fontFamily=d.font; if(d.fontUrl&&!document.querySelector('link[href="'+d.fontUrl+'"]')){ var l=document.createElement('link'); l.rel='stylesheet'; l.href=d.fontUrl; document.head.appendChild(l); }
    nm.textContent=d.name+(d.kind?' · '+d.kind:'');
    tx.textContent=d.vi||''; tx.style.textAlign=d.al||''; fit(); spots();
  });
  D.onOverlay(function(st){ document.body.classList.toggle('move',!!st.move); fit(); });
  window.addEventListener('resize',function(){ fit(); spots(); });
  /* transparent windows cannot be resized by their edges on Windows: resize from the corner grip */
  grip.addEventListener('pointerdown',function(e){
    if(!cur) return; e.preventDefault(); grip.setPointerCapture(e.pointerId);
    var sx=e.screenX, sy=e.screenY, w0=window.innerWidth, h0=window.innerHeight;
    function mv(ev){ D.zoneSize(cur.id,w0+ev.screenX-sx,h0+ev.screenY-sy); }
    function up(){ grip.removeEventListener('pointermove',mv); grip.removeEventListener('pointerup',up); }
    grip.addEventListener('pointermove',mv); grip.addEventListener('pointerup',up);
  });
})();
</script>
</body></html>
