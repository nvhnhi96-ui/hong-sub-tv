<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Hóng Sub dịch cả màn hình</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;user-select:none}
.b{position:absolute;box-sizing:border-box;width:max-content;background:rgba(12,14,18,.93);color:#fff;border-radius:3px;padding:1px 5px;line-height:1.22;font-weight:600;overflow:hidden;box-shadow:0 0 0 1px rgba(255,196,0,.35);padding-top:.16em;white-space:normal;word-break:break-word}
.hs-key{display:inline-block;height:1.08em;width:1.08em;vertical-align:-.2em;margin:0 .08em;border-radius:.2em}
span.hs-key{height:auto;width:auto;padding:0 .3em;font-size:.82em;line-height:1.25;border:.1em solid currentColor;border-radius:.35em;vertical-align:.05em}
</style></head>
<body>
<div id="root"></div>
<script>
(function(){
  var root=document.getElementById('root');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  window.hsDesktop.onFull(function(d){
    root.innerHTML='';
    if(!d||!d.items) return;
    if(d.fontUrl&&!document.querySelector('link[href="'+d.fontUrl+'"]')){ var l=document.createElement('link'); l.rel='stylesheet'; l.href=d.fontUrl; document.head.appendChild(l); }
    var W=window.innerWidth, H=window.innerHeight;
    d.items.forEach(function(it){
      /* each Vietnamese line right over its English line, as tall as the English letters; a longer line is squeezed
         sideways (down to 70%), then smaller */
      if(it.lg&&it.lg.length){
        it.lg.forEach(function(g){ if(!String(g.vi||'').trim()) return;
          var d2=document.createElement('div'), Ww=g.w*W, f2=Math.max(7,g.f*H);
          d2.style.cssText='position:absolute;box-sizing:border-box;white-space:pre;padding:0 2px;font-weight:600;overflow:visible;color:'+(it.fg||'#fff')+';background:'+(it.bg||'rgba(12,14,18,.93)')+';left:'+(g.x*W)+'px;top:'+(g.y*H)+'px;height:'+(g.h*H)+'px;padding-top:'+Math.max(0,g.pt*H)+'px;line-height:'+(g.lh*H)+'px;font-size:'+f2.toFixed(1)+'px';
          if(d.font) d2.style.fontFamily=d.font;
          d2.textContent=String(g.vi).replace(/\{\{\d+\}\}/g,'');
          root.appendChild(d2);
          var nw=d2.scrollWidth; while(nw*0.7>Ww&&f2>7){ f2--; d2.style.fontSize=f2+'px'; nw=d2.scrollWidth; }
          var ww=Math.max(nw,Ww); d2.style.width=ww+'px'; if(nw>Ww){ d2.style.transform='scaleX('+(Ww/nw).toFixed(3)+')'; d2.style.transformOrigin='0 50%'; }
        });
        return;
      }
      var el=document.createElement('div'); el.className='b';
      var L=it.x*W, w=Math.max(24,it.w*W); el.style.left=L+'px'; el.style.top=(it.y*H)+'px'; el.style.width=w+'px'; el.style.minHeight=(it.h*H)+'px'; el.style.maxHeight=(it.h*H+Math.min(it.h*H*0.15+6,Math.max(0,(it.gb==null?1:it.gb)*H-2)))+'px';   /* taller only into empty room below: never over the next box */ if(d.font) el.style.fontFamily=d.font; if(it.bg){ el.style.background=it.bg; el.style.boxShadow='none'; } if(it.fg) el.style.color=it.fg;
      var f=Math.max(10,Math.round(it.fz>0?it.fz*H:it.lh*H*0.7));   /* fz: the original letters measured on the picture */ el.style.fontSize=f+'px';
      el.innerHTML=it.html&&/^[^<]*(?:<(?:br|img class="hs-key" src="data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+" alt="[^"<>]*"|span class="hs-key")>[^<]*(?:<\/span>[^<]*)?)*$/.test(it.html)?it.html:esc(it.vi).replace(/\n/g,'<br>');   /* with the controller button pictures: only Hóng Sub's own markup */
      root.appendChild(el);
      /* Vietnamese is often longer: shrink until it fits about the space of the English */
      var maxH=parseFloat(el.style.maxHeight); function over(){ return el.scrollHeight>maxH+1||el.scrollWidth>el.clientWidth+1; }
      while(f>9&&over()){ f--; el.style.fontSize=f+'px'; }
      while(f>7&&over()){ f--; el.style.fontSize=f+'px'; }
    });
    /* two boxes that still touch */
    var ks=[].slice.call(root.querySelectorAll('.b'));
    for(var i=0;i<ks.length;i++) for(var j=i+1;j<ks.length;j++){ 
      var r=ks[i].getBoundingClientRect(), q=ks[j].getBoundingClientRect();
      if(Math.min(r.right,q.right)-Math.max(r.left,q.left)>1&&Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top)>1){
        /* the box with less text keeps only its own place, smaller letters; never hidden (its translation is not lost) */
        var sm=ks[i].textContent.length<ks[j].textContent.length?ks[i]:ks[j], ot=sm===ks[i]?ks[j]:ks[i], rs=sm.getBoundingClientRect(), ro=ot.getBoundingClientRect();
        var ov=Math.min(rs.bottom,ro.bottom)-Math.max(rs.top,ro.top);
        if(ov>0){ var nh=Math.max(8,rs.height-ov-1); if(rs.top>=ro.top) sm.style.top=(parseFloat(sm.style.top)+ov+1)+'px'; sm.style.minHeight='0'; sm.style.height=sm.style.maxHeight=nh+'px'; }
        var fz=parseFloat(sm.style.fontSize); while(fz>6&&(sm.scrollHeight>sm.clientHeight+1||sm.scrollWidth>sm.clientWidth+1)){ fz-=0.5; sm.style.fontSize=fz+'px'; } } }
  });
})();
</script>
</body></html>
