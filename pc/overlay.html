<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Hóng Sub phụ đề</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;user-select:none}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 12px;box-sizing:border-box}
#box{width:100%;box-sizing:border-box;max-width:100%;background:rgba(8,8,10,.74);border-radius:14px;padding:10px 22px 12px;text-align:center;opacity:0;transition:opacity .25s}
#box.on{opacity:1}
#vi{color:#fff;font-weight:700;font-size:28px;line-height:1.3;text-shadow:0 2px 3px #000,0 0 2px #000}
#vi .who{color:#FFC400}
#en{color:#C9C9D2;font-size:15px;margin-top:3px;text-shadow:0 1px 2px #000}
#en:empty{display:none}
/* over the game's own subtitle: fill the area, letters as big as fit */
body.cover #wrap{padding:0;justify-content:center}
body.cover #box{width:100%;height:100%;box-sizing:border-box;border-radius:4px;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
body.move{-webkit-app-region:drag;cursor:move}
body.move #wrap{outline:3px dashed #FFC400;outline-offset:-3px;background:rgba(255,196,0,.10)}
#mv{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#FFC400;color:#111;font-weight:700;border-radius:10px;padding:6px 8px 6px 14px;font-size:14px;align-items:center;gap:10px;white-space:nowrap}
body.move #mv{display:flex}
#mv button{-webkit-app-region:no-drag;background:#111;color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
</style></head>
<body>
<div id="mv">Kéo khung vàng tới chỗ muốn đặt phụ đề <button id="done" type="button">Xong (F10)</button></div>
<div id="wrap"><div id="box"><div id="vi"></div><div id="en"></div></div></div>
<script>
(function(){
  var D=window.hsDesktop, box=document.getElementById('box'), vi=document.getElementById('vi'), en=document.getElementById('en');
  var timer=null, moving=false, has=false, hold=0;
  function hideLater(){ clearTimeout(timer); if(hold>0) timer=setTimeout(function(){ if(!moving) box.classList.remove('on'); }, hold*1000); }
  function style(o){ if(o.color) vi.style.color=o.color; if(o.bg!==undefined) box.style.background='rgba(8,8,10,'+o.bg+')'; if(o.en!==undefined) en.style.display=o.en?'':'none'; if(o.font) vi.style.fontWeight=o.font; if(o.family){ vi.style.fontFamily=o.family; en.style.fontFamily=o.family; } if(o.hgt){ box.dataset.hgt=o.hgt; } if(o.lm!==undefined){ lm=!!o.lm; vi.style.whiteSpace=lm?'nowrap':''; } pad(); fit(); if(o.fontUrl&&!document.querySelector('link[href="'+o.fontUrl+'"]')){ var l=document.createElement('link'); l.rel='stylesheet'; l.href=o.fontUrl; document.head.appendChild(l); } }
  var base=28, cover=false, lm=true, spotFs=0;
  /* "Độ cao khung nền" off the original subtitle: more or less room above and below the words */
  function pad(){ var k=(+box.dataset.hgt||100)/100; if(cover){ box.style.paddingTop=box.style.paddingBottom=''; return; } box.style.paddingTop=Math.round(10*k)+'px'; box.style.paddingBottom=Math.round(12*k)+'px'; }
  function size(px){ base=px; vi.style.fontSize=px+'px'; en.style.fontSize=Math.max(13,Math.round(px*.52))+'px'; fit(); }
  /* over the original subtitle the box is the subtitle's size: smaller letters rather than spilling out */
  /* same lines as the original (no extra wrapping): letters get smaller until each line fits the box */
  function fit(){ var f=spotFs?spotFs*Math.max(.4,Math.min(2.5,base/28)):base;   /* over the original: its letters' size, made bigger or smaller by Cỡ chữ (28 = as the original) */
    vi.style.fontSize=f+'px'; if(!cover&&!lm) return;   /* over the original text: start from the original letters' size */
    for(var i=0;i<24&&((cover&&box.scrollHeight>box.clientHeight+1)||vi.scrollWidth>vi.clientWidth+1||box.scrollWidth>box.clientWidth+1)&&f>9;i++){ f*=0.92; vi.style.fontSize=f+'px'; en.style.fontSize=Math.max(10,f*.52)+'px'; } }
  try{ document.fonts.addEventListener('loadingdone',function(){ fit(); }); }catch(e){}
  D.onSub(function(p){
    if(p.size) size(p.size);
    if(p.hold!==undefined) hold=+p.hold||0;
    if(p.style) style(p.style);
    if(p.cover!==undefined){ cover=!!p.cover; document.body.classList.toggle('cover',cover);
      spotFs=cover&&p.spot&&p.fs?+p.fs:0; vi.style.textAlign=en.style.textAlign=cover&&p.spot?({l:'left',c:'center',r:'right'}[p.al]||''):''; box.style.alignItems=cover&&p.spot?({l:'flex-start',c:'center',r:'flex-end'}[p.al]||''):'';
      pad(); fit(); }
    if(p.html!==undefined){ vi.innerHTML=p.html; en.textContent=p.en||''; has=!!p.html; box.classList.toggle('on',has); hideLater(); fit(); }
  });
  D.onOverlay(function(st){
    moving=!!st.move; document.body.classList.toggle('move',moving);
    if(moving){ if(!has){ vi.textContent='Phụ đề tiếng Việt sẽ hiện ở đây'; en.textContent='English subtitle'; } box.classList.add('on'); }
    else{ if(!has){ vi.textContent=''; en.textContent=''; box.classList.remove('on'); } else hideLater(); }
  });
  document.getElementById('done').addEventListener('click',function(){ D.overlay('done'); });
})();
</script>
</body></html>
