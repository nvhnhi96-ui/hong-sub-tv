<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Hóng Sub vùng dịch</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI","Be Vietnam Pro",system-ui,sans-serif;user-select:none}
#list{position:absolute;inset:0;padding:6px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.c{background:rgba(10,12,16,.86);border-left:4px solid #3FB6FF;border-radius:10px;padding:8px 12px;color:#fff}
.c b{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.c div{font-size:15px;line-height:1.4;white-space:pre-line;font-weight:500}
body.move{-webkit-app-region:drag;cursor:move}
body.move #list{outline:3px dashed #3FB6FF;outline-offset:-3px;background:rgba(63,182,255,.10)}
body.move #list:empty::before{content:"Bản dịch nhiệm vụ, vật phẩm hiện ở đây. Kéo khung xanh tới chỗ muốn đặt.";color:#fff;background:rgba(10,12,16,.86);border-radius:10px;padding:10px 12px;font-size:14px}
</style></head>
<body>
<div id="list"></div>
<script>
(function(){
  var D=window.hsDesktop, list=document.getElementById('list');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  D.onZones(function(z){ list.innerHTML=(z||[]).map(function(x){return '<div class="c" style="border-left-color:'+x.c+'"><b style="color:'+x.c+'">'+esc(x.name)+'</b><div>'+esc(x.vi)+'</div></div>';}).join(''); });
  D.onOverlay(function(st){ document.body.classList.toggle('move',!!st.move); });
})();
</script>
</body></html>
