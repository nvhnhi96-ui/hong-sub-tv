plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// PS5 / PS4 inside the app: the Remote Play core (rp/mobile) needs a chiaki-ng checkout in rp/chiaki-ng (the CI puts it there)
def chiakiDir = file('../rp/chiaki-ng')
def withRp = new File(chiakiDir, 'lib/src/session.c').exists()

android {
    namespace 'store.honggame.hongsub'
    compileSdk 36

    defaultConfig {
        applicationId 'store.honggame.hongsub'
        minSdk 24
        targetSdk 36
        versionCode runNumber
        versionName "1.0." + runNumber
        if (withRp) {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
            externalNativeBuild {
                cmake {
                    arguments "-DHSRP_SHARED=ON", "-DCHIAKI_DIR=" + chiakiDir.absolutePath,
                            "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                    def mb = System.getenv("HSRP_MBEDTLS_DIR")
                    if (mb) arguments "-DFETCHCONTENT_SOURCE_DIR_MBEDTLS=" + mb
                    def py = System.getenv("HSRP_PYTHON")
                    if (py) arguments "-DPython3_EXECUTABLE=" + py
                }
            }
        }
    }

    if (withRp) {
        externalNativeBuild { cmake { path '../rp/mobile/CMakeLists.txt' } }
    }

    signingConfigs {
        if (System.getenv("HSTV_KEYSTORE_B64")) {
            release {
                storeFile file(System.getenv("RUNNER_TEMP") + "/hstv.jks")
                // only the key file is secret (GitHub Secret HSTV_KEYSTORE_B64); the other three may stay unset
                storePassword System.getenv("HSTV_STORE_PASSWORD") ?: "hongsubtv"
                keyAlias System.getenv("HSTV_KEY_ALIAS") ?: "hongsubtv"
                keyPassword System.getenv("HSTV_KEY_PASSWORD") ?: (System.getenv("HSTV_STORE_PASSWORD") ?: "hongsubtv")
            }
        }
    }

    // site: downloaded from honggame.store, updates itself; play: Google Play (updated by Google Play)
    flavorDimensions 'store'
    productFlavors {
        site { dimension 'store' }
        play { dimension 'store' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("HSTV_KEYSTORE_B64") ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main.assets.srcDirs += ['../presets']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // SSH to a TV LG in Developer Mode, to put the Hóng Sub app on it from the phone (LgTv.java)
    implementation 'com.github.mwiede:jsch:0.2.20'
}

// one library (SSH, for TV LG): the Hóng Sub page (assets/app.html, the same page as the Windows app) does the reading and translating;
// the one native part is the Remote Play core (rp/mobile, AGPL-3.0, built on chiaki-ng)
