plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'store.honggame.hongsubtv'
    compileSdk 34

    defaultConfig {
        applicationId 'store.honggame.hongsubtv'
        minSdk 23
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    // Khoa ky co dinh (GitHub Secret HSTV_KEYSTORE_B64) de app TV tu cap nhat duoc: Android chi nhan ban moi cung khoa.
    // Chua co secret thi ky bang khoa debug moi lan mot khac, app khong tu cap nhat duoc.
    signingConfigs {
        if (System.getenv("HSTV_KEYSTORE_B64")) {
            release {
                storeFile file(System.getenv("RUNNER_TEMP") + "/hstv.jks")
                // only the key file is secret (GitHub Secret HSTV_KEYSTORE_B64); the other three may stay unset
                storePassword System.getenv("HSTV_STORE_PASSWORD") ?: "hongsubtv"
                keyAlias System.getenv("HSTV_KEY_ALIAS") ?: "hongsubtv"
                keyPassword System.getenv("HSTV_KEY_PASSWORD") ?: (System.getenv("HSTV_STORE_PASSWORD") ?: "hongsubtv")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("HSTV_KEYSTORE_B64") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
