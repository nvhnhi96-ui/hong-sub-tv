plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'store.honggame.hongsubtv'
    compileSdk 34

    defaultConfig {
        applicationId 'store.honggame.hongsubtv'
        minSdk 23
        targetSdk 34
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    // Ban thu nghiem: ky bang khoa debug do GitHub tao moi moi lan dung.
    // Khi can khoa ky co dinh, them GitHub Secrets HSTV_KEYSTORE_B64, HSTV_STORE_PASSWORD, HSTV_KEY_ALIAS, HSTV_KEY_PASSWORD.
    signingConfigs {
        if (System.getenv("HSTV_KEYSTORE_B64")) {
            release {
                storeFile file(System.getenv("RUNNER_TEMP") + "/hstv.jks")
                storePassword System.getenv("HSTV_STORE_PASSWORD")
                keyAlias System.getenv("HSTV_KEY_ALIAS")
                keyPassword System.getenv("HSTV_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("HSTV_KEYSTORE_B64") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
