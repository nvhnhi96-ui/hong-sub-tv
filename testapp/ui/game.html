<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>PS Remote Play - Game thử (Hóng Sub Test)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="scenes.js"></script>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'), x=cv.getContext('2d');
var W=1280, H=720;
var st={scene:0, idx:0, playing:false, speed:1, t0:0, shownAt:0};
var api=window.hsTest||null;

function resize(){ var r=window.devicePixelRatio||1; cv.width=Math.round(innerWidth*r); cv.height=Math.round(innerHeight*r); }
addEventListener('resize',resize); resize();

/* ---------- backgrounds (drawn in a 1280x720 world) ---------- */
function rnd(i){ var s=Math.sin(i*12.9898)*43758.5453; return s-Math.floor(s); }
function bgCalm(t){
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2B2F55'); g.addColorStop(.55,'#B35A55'); g.addColorStop(1,'#2A1C2A'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,214,140,.9)'; x.beginPath(); x.arc(860,300+Math.sin(t/4000)*6,70,0,7); x.fill();
  x.fillStyle='#3B2440'; x.beginPath(); x.moveTo(0,470); for(var i=0;i<=16;i++){ x.lineTo(i*80, 430-rnd(i)*120); } x.lineTo(W,H); x.lineTo(0,H); x.fill();
  x.fillStyle='#1E1424'; x.beginPath(); x.moveTo(0,560); for(var j=0;j<=10;j++){ x.lineTo(j*128, 520-rnd(j+40)*70); } x.lineTo(W,H); x.lineTo(0,H); x.fill();
  x.fillStyle='#0E0A12'; x.fillRect(470,470,34,100); x.fillRect(520,450,40,120);
}
function bgAction(t){
  x.fillStyle='#3A2B1E'; x.fillRect(0,0,W,H);
  for(var i=0;i<40;i++){
    var s=t/(300+rnd(i)*500), px=((rnd(i+1)*W+s*90*(i%2?1:-1))%(W+300)+W+300)%(W+300)-150, py=rnd(i+7)*H;
    x.fillStyle='hsl('+Math.round(rnd(i+3)*60+10)+','+Math.round(40+rnd(i)*50)+'%,'+Math.round(25+rnd(i+9)*60)+'%)';
    x.fillRect(px,py,60+rnd(i+2)*240,30+rnd(i+5)*140);
  }
  if(Math.floor(t/700)%4===0){ x.fillStyle='rgba(255,240,200,.35)'; x.fillRect(0,0,W,H); }   /* explosion flash */
  for(var k=0;k<14;k++){ x.fillStyle='rgba(255,255,255,.85)'; x.fillRect(((t*0.6+k*97)%W),((k*53+t*0.3)%H),4,26); }  /* sparks over the subtitle area */
}
function bgSnow(t){
  var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#DCE6EE'); g.addColorStop(1,'#F7FAFC'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='#B9C7D3'; x.beginPath(); x.moveTo(0,420); for(var i=0;i<=8;i++){ x.lineTo(i*160,330-rnd(i+20)*140); } x.lineTo(W,H); x.lineTo(0,H); x.fill();
  x.fillStyle='#FFFFFF'; x.fillRect(0,520,W,200);
  for(var k=0;k<120;k++){ x.fillStyle='rgba(255,255,255,.95)'; var sy=(rnd(k)*H+t*(0.04+rnd(k+4)*0.08))%H; x.beginPath(); x.arc((rnd(k+1)*W+Math.sin(t/900+k)*20),sy,2+rnd(k+2)*3,0,7); x.fill(); }
}
function bgCave(t){
  x.fillStyle='#07080B'; x.fillRect(0,0,W,H);
  var fl=.6+.4*Math.sin(t/120)*Math.sin(t/77);
  var g=x.createRadialGradient(640,420,20,640,420,520); g.addColorStop(0,'rgba(255,150,60,'+(.35*fl+.2)+')'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='#15181F'; for(var i=0;i<12;i++){ x.beginPath(); x.moveTo(i*120,0); x.lineTo(i*120+60,90+rnd(i)*120); x.lineTo(i*120+120,0); x.fill(); }
}
function bgSpace(t){
  x.fillStyle='#04060D'; x.fillRect(0,0,W,H);
  for(var i=0;i<220;i++){ var b=.4+.6*rnd(i+3); x.fillStyle='rgba(255,255,255,'+b+')'; x.fillRect(((rnd(i)*W-t*0.02*(1+rnd(i+1)*3))%W+W)%W,rnd(i+2)*H,2,2); }
  x.fillStyle='#1C2A44'; x.beginPath(); x.arc(980,240,150,0,7); x.fill();
  x.strokeStyle='#5AA9FF'; x.lineWidth=3; x.strokeRect(80,80,1120,560);   /* cockpit frame */
  x.fillStyle='rgba(90,169,255,.18)'; x.fillRect(80,560,1120,80);
}
function bgMenu(){
  x.fillStyle='#14171C'; x.fillRect(0,0,W,H);
  x.fillStyle='#1E232B'; x.fillRect(60,60,1160,600);
  x.fillStyle='#E9E3D3'; x.font='700 34px "Segoe UI",Arial'; x.textAlign='left'; x.fillText('QUEST LOG',100,120);
  x.fillStyle='#8C96A3'; x.font='500 20px "Segoe UI",Arial'; x.fillText('Main Quests',100,175); x.fillText('Side Quests',100,395);
  var q=['The Lost Caravan','Embers of the Old King','A Debt to the Ferryman'], s=['Wolves at the Mill','The Missing Letter'];
  x.font='600 24px "Segoe UI",Arial';
  q.forEach(function(n,i){ x.fillStyle=i===0?'#FFC400':'#E9E3D3'; x.fillText(n,110,220+i*44); });
  s.forEach(function(n,i){ x.fillStyle='#E9E3D3'; x.fillText(n,110,440+i*44); });
  x.fillStyle='#262C35'; x.fillRect(560,150,620,470);
  x.fillStyle='#FFC400'; x.font='700 28px "Segoe UI",Arial'; x.fillText('The Lost Caravan',590,200);
  x.fillStyle='#D8D2C2'; x.font='400 21px "Segoe UI",Arial';
  ['A merchant caravan vanished on the eastern road','three days ago. Speak to the innkeeper in','Brookhollow and search the woods near the river.'].forEach(function(l,i){ x.fillText(l,590,250+i*32); });
  x.fillStyle='#8C96A3'; x.font='600 18px "Segoe UI",Arial'; x.fillText('OBJECTIVES',590,380);
  x.fillStyle='#E9E3D3'; x.font='400 21px "Segoe UI",Arial';
  ['Talk to the innkeeper','Find the broken wagon','Return the ledger to Mistress Hale'].forEach(function(l,i){ x.fillText((i===0?'✓  ':'□  ')+l,600,420+i*36); });
  x.fillStyle='#8C96A3'; x.font='500 18px "Segoe UI",Arial'; x.fillText('Reward: 350 gold, Iron Sword',590,560);
  x.fillStyle='#8C96A3'; x.font='500 18px "Segoe UI",Arial'; x.fillText('✕ Select     ○ Back     △ Track quest',100,640);
}
var BG={calm:bgCalm,action:bgAction,snow:bgSnow,cave:bgCave,space:bgSpace,menu:bgMenu};

/* ---------- subtitles ---------- */
function subLine(text,y,style){
  var size=style.size||30, m=/^([A-Z][A-Z .'-]{0,24}):\s+(.*)$/.exec(text);
  x.font=(style.weight||600)+' '+size+'px '+(style.font||'"Segoe UI",Arial'); x.textAlign='left'; x.lineJoin='round';
  var name=m?m[1]+': ':'', body=m?m[2]:text, wn=x.measureText(name).width, wb=x.measureText(body).width, sx=640-(wn+wb)/2;
  if(style.box){ x.fillStyle='rgba(0,0,0,.62)'; x.fillRect(sx-14,y-size+2,wn+wb+28,size+16); }
  if(style.outline!==false){ x.lineWidth=Math.max(3,size/7); x.strokeStyle='rgba(0,0,0,.85)'; x.strokeText(name,sx,y); x.strokeText(body,sx+wn,y); }
  if(name){ x.fillStyle=style.nameColor||'#7CC4FF'; x.fillText(name,sx,y); }
  x.fillStyle=style.color||'#FFFFFF'; x.fillText(body,sx+wn,y);
}
function current(){ return SCENES[st.scene]; }
function lineDur(sc){ return (sc.dur||3500)/st.speed; }
function announce(){
  var sc=current(), L=sc.lines[st.idx]; if(!L) return;
  st.shownAt=Date.now();
  if(api) api.event({type:'line',scene:sc.id,idx:st.idx,text:L.text||L,expect:L.expect||'translate'});
}
function frame(now){
  var sc=current(), t=performance.now();
  x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  (BG[sc.bg]||bgCalm)(t);
  if(sc.mode!=='menu'){
    if(st.playing&&Date.now()-st.shownAt>lineDur(sc)){
      st.idx++;
      if(st.idx>=sc.lines.length){ st.idx=0; st.playing=false; if(api) api.event({type:'end',scene:sc.id}); }
      else announce();
    }
    var gap=sc.gap?Math.min(500,lineDur(sc)*.12):0, showing=st.playing&&(Date.now()-st.shownAt>gap||!sc.gap);
    if(showing){
      if(sc.mode==='rolling'){
        var prev=sc.lines[st.idx-1]; if(prev) subLine(prev.text||prev,600,sc.style);
        subLine((sc.lines[st.idx].text||sc.lines[st.idx]),648,sc.style);
      }else{
        var L=sc.lines[st.idx], txt=L.text||L, parts=txt.split('\n');
        parts.forEach(function(p,i){ subLine(p,648-(parts.length-1-i)*(((sc.style.size||30))+12),sc.style); });
      }
    }
  }
  x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  x.fillStyle='rgba(255,255,255,.45)'; x.font='600 16px "Segoe UI",Arial'; x.textAlign='left';
  x.fillText('GAME THỬ · '+sc.name+(st.playing?'':' · đang dừng'),24,34);
  requestAnimationFrame(frame);
}
function cmd(c){
  if(c.scene!==undefined&&c.scene!==st.scene){ st.scene=Math.max(0,Math.min(SCENES.length-1,c.scene)); st.idx=0; st.playing=false; }
  if(c.speed) st.speed=c.speed;
  if(c.play===true){ if(current().mode==='menu'){ st.playing=true; if(api) api.event({type:'menu',scene:current().id}); } else { if(st.idx>=current().lines.length) st.idx=0; st.playing=true; announce(); } }
  if(c.play===false) st.playing=false;
  if(c.step){ var n=current().lines.length; st.idx=(st.idx+c.step+n)%n; st.playing=true; announce(); }
  if(c.restart){ st.idx=0; st.playing=true; announce(); }
  if(api) api.event({type:'state',scene:st.scene,idx:st.idx,playing:st.playing,speed:st.speed});
}
if(api) api.onCmd(cmd);
addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); cmd({play:!st.playing}); }
  else if(e.code==='ArrowRight') cmd({step:1}); else if(e.code==='ArrowLeft') cmd({step:-1});
  else if(e.code==='KeyF'||e.code==='F11'){ e.preventDefault(); if(api) api.fullscreen(); }
  else if(e.code==='Escape'){ if(api) api.fullscreen(false); }
});
window.gameCmd=cmd;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
