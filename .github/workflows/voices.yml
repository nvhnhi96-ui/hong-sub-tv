name: Build Vietnamese voice pack

on:
  push:
    branches: [ main ]
    paths: [ 'voices/**', '.github/workflows/voices.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voicepack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Portable Python
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '3.12.10'
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile "$env:RUNNER_TEMP\py.zip"
          New-Item -ItemType Directory -Force pack\python | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\py.zip" -DestinationPath pack\python -Force
          $pth = Get-ChildItem pack\python -Filter 'python3*._pth' | Select-Object -First 1
          "python312.zip`r`n.`r`nLib\site-packages`r`n..`r`nimport site" | Set-Content $pth.FullName -Encoding ascii
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile "$env:RUNNER_TEMP\get-pip.py"
          pack\python\python.exe "$env:RUNNER_TEMP\get-pip.py" --no-warn-script-location
          pack\python\python.exe -m pip install --no-warn-script-location --no-deps vieneu==3.8.4
          pack\python\python.exe -m pip install --no-warn-script-location "sea-g2p>=0.9.1" "onnxruntime>=1.20.0" numpy soundfile soxr "kaldi-native-fbank>=1.20" "tokenizers>=0.20" huggingface_hub PyYAML
          pack\python\python.exe -m pip list

      - name: Voice engine and models
        env:
          HS_VOICE_ONLINE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item voices\hs_voice.py, voices\test_voice.py pack\
          New-Item -ItemType Directory -Force pack\hf | Out-Null
          $env:HF_HOME = (Resolve-Path pack\hf).Path
          pack\python\python.exe pack\test_voice.py "$env:RUNNER_TEMP\samples" fp32
          pack\python\python.exe pack\test_voice.py "$env:RUNNER_TEMP\samples" int8
          pack\python\python.exe -c "from huggingface_hub import hf_hub_download as d; import re; t=open(d('pnnbao-ump/VieNeu-TTS-v3-Turbo','README.md'),encoding='utf-8').read(); print(t[:1800])"
          pack\python\python.exe -c "from huggingface_hub import hf_hub_download as d; t=open(d('OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano','README.md'),encoding='utf-8').read(); print(t[:800])"

      - name: Flatten model cache
        run: pack\python\python.exe voices\flatten_cache.py pack\hf

      - name: Offline check and sizes
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $env:HF_HOME = (Resolve-Path pack\hf).Path
          $env:HF_HUB_OFFLINE = '1'
          pack\python\python.exe pack\test_voice.py "$env:RUNNER_TEMP\samples-offline" fp32
          Get-ChildItem pack\hf -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Replace((Resolve-Path pack).Path,'') }
          "python: {0:N0}" -f ((Get-ChildItem pack\python -Recurse -File | Measure-Object Length -Sum).Sum)
          "hf: {0:N0}" -f ((Get-ChildItem pack\hf -Recurse -File | Measure-Object Length -Sum).Sum)
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List

      - name: Pack
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force pack\hf\xet -ErrorAction SilentlyContinue
          Get-ChildItem pack -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          "Bộ giọng AI tiếng Việt cho Hóng Sub`r`nMô hình: VieNeu-TTS v3 Turbo (pnnbao-ump/VieNeu-TTS-v3-Turbo), giấy phép Apache-2.0`r`nBộ mã âm thanh: OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano, giấy phép Apache-2.0`r`nThư viện: vieneu, sea-g2p (Apache-2.0), onnxruntime (MIT), Python (PSF)" | Out-File pack\NGUON-GIONG-DOC.txt -Encoding utf8
          Push-Location pack
          7z a -tzip -mx=1 ..\hong-sub-voices.zip * | Select-Object -Last 3
          Pop-Location
          "zip: {0:N0}" -f (Get-Item hong-sub-voices.zip).Length

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voices-1
          name: Bộ giọng AI tiếng Việt cho Hóng Sub
          body: |
            Bộ giọng đọc AI tiếng Việt (25 giọng nam/nữ, ba miền) cho phần mềm Hóng Sub trên Windows.
            Phần mềm tự tải gói này khi bấm "Tải bộ giọng AI" trong trang Giọng đọc, không cần tải tay.
            Mô hình VieNeu-TTS v3 Turbo và MOSS-Audio-Tokenizer-Nano, giấy phép Apache-2.0.
          files: hong-sub-voices.zip
          make_latest: false
