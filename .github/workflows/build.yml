name: Build Hong Sub

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'presets/**', 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key (if configured)
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
        if: env.HSTV_KEYSTORE_B64 != ''
        run: echo "$HSTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hstv.jks"

      - name: Build APK
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
          HSTV_STORE_PASSWORD: ${{ secrets.HSTV_STORE_PASSWORD }}
          HSTV_KEY_ALIAS: ${{ secrets.HSTV_KEY_ALIAS }}
          HSTV_KEY_PASSWORD: ${{ secrets.HSTV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :phone:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk hong-sub-tv.apk
          cp phone/build/outputs/apk/release/phone-release.apk hong-sub-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            hong-sub-tv.apk
            hong-sub-android.apk

  rp-helper:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p openssl:p json-c:p miniupnpc:p libevent:p python:p python-protobuf:p ntldd:p

      - name: Get chiaki-ng source (AGPL-3.0)
        run: |
          TAG=$(curl -s https://api.github.com/repos/streetpea/chiaki-ng/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          [ -n "$TAG" ] || TAG=v1.10.1
          echo "chiaki-ng $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/streetpea/chiaki-ng.git rp/chiaki-ng
          cd rp/chiaki-ng && git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
          echo "$TAG" > ../CHIAKI_TAG

      - name: Build hongsub-rp
        run: |
          cmake -S rp -B rp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build rp/build --target hongsub-rp
          mkdir -p out
          cp rp/build/hongsub-rp.exe out/
          ntldd -R out/hongsub-rp.exe | grep -i mingw64 | sed -E 's/.*=> *([^ ]+) .*/\1/' | while read f; do cp "$(cygpath -u "$f")" out/ ; done
          ls -la out
          ./out/hongsub-rp.exe version
          cp rp/chiaki-ng/COPYING out/CHIAKI-NG-LICENSE-AGPL3.txt
          printf 'hongsub-rp: cau noi Remote Play cua Hong Sub, dung chiaki-lib cua chiaki-ng %s (GNU AGPL-3.0).\r\nMa nguon chiaki-ng: https://github.com/streetpea/chiaki-ng\r\nMa nguon hongsub-rp: https://github.com/nvhnhi96-ui/hong-sub-tv/tree/main/rp\r\n' "$(cat rp/CHIAKI_TAG)" > out/NGUON-MA-REMOTE-PLAY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rp-helper
          path: out

  windows:
    needs: [ rp-helper ]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: rp-helper
          path: pc/rp

      - name: Get Vietnamese voice (Piper)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # --- Piper (MIT) + Vietnamese voice VAIS-1000 (CC BY 4.0) ---
          Invoke-WebRequest https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile "$env:RUNNER_TEMP\piper.zip"
          Expand-Archive "$env:RUNNER_TEMP\piper.zip" -DestinationPath voices -Force
          $hf = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium'
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx" -OutFile voices\vi_VN-vais1000-medium.onnx
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx.json" -OutFile voices\vi_VN-vais1000-medium.onnx.json
          try { Invoke-WebRequest https://raw.githubusercontent.com/rhasspy/piper/master/LICENSE.md -OutFile voices\PIPER-LICENSE-MIT.txt } catch { }
          "Giọng đọc: Piper (MIT, https://github.com/rhasspy/piper)`r`nGiọng tiếng Việt: vi_VN-vais1000-medium, huấn luyện từ VAIS-1000 Vietnamese Speech Synthesis Corpus, giấy phép CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).`r`nNguồn: https://huggingface.co/rhasspy/piper-voices" | Out-File voices\NGUON-GIONG-DOC.txt -Encoding utf8
          Get-ChildItem voices | ForEach-Object { Write-Host "voice file: $($_.Name) $($_.Length)" }

      - name: Set version
        run: npm pkg set version=1.0.${{ github.run_number }}

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Self test on Windows
        shell: pwsh
        env:
          HS_SELFTEST: '1'
          HS_SELFTEST_OUT: ${{ runner.temp }}\selftest
        run: |
          $exe = Get-ChildItem dist\win-unpacked -Filter HongSub.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host 'selftest timed out' }
          Get-Content "$env:HS_SELFTEST_OUT\log.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:HS_SELFTEST_OUT\result.json" -ErrorAction SilentlyContinue

      - name: Save self test pictures to branch selftest-output
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}\selftest
        run: |
          $repo = '${{ github.repository }}'
          $exists = gh api "repos/$repo/branches/selftest-output" 2>$null
          if (-not $exists) {
            $sha = gh api "repos/$repo/git/ref/heads/main" --jq .object.sha
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/selftest-output -f sha=$sha | Out-Null
          }
          Get-ChildItem $env:OUT -File | ForEach-Object {
            $name = $_.Name
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            $old = gh api "repos/$repo/contents/selftest/$($name)?ref=selftest-output" --jq .sha 2>$null
            $body = @{ message = "selftest $name"; content = $b64; branch = 'selftest-output' }
            if ($old) { $body.sha = $old }
            $body | ConvertTo-Json | gh api -X PUT "repos/$repo/contents/selftest/$name" --input - | Out-Null
            Write-Host "saved $name"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: ${{ runner.temp }}\selftest

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pc/dist/hong-sub-pc.exe

  release:
    needs: [ android, windows ]
    if: needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hóng Sub 1.0.${{ github.run_number }}
          body: |
            Bản tự động.
            - hong-sub-pc.exe: phần mềm cho máy tính Windows 10/11.
            - hong-sub-tv.apk: Android TV / Google TV (cài bằng Downloader).
            - hong-sub-android.apk: điện thoại Android, dùng kèm app PS Remote Play.
          files: |
            out/hong-sub-pc.exe
            out/hong-sub-tv.apk
            out/hong-sub-android.apk
          make_latest: true
