name: Build Hong Sub

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'presets/**', 'README.md', 'voices/**', '.github/workflows/voices.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key (if configured)
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
        if: env.HSTV_KEYSTORE_B64 != ''
        run: echo "$HSTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hstv.jks"

      # PS5 / PS4 inside the phone app: the Remote Play core (rp/mobile) is built on chiaki-ng (AGPL-3.0)
      - name: Get chiaki-ng and Mbed TLS for the phone Remote Play core
        run: |
          set -e
          git clone --depth 1 --branch v1.10.1 https://github.com/streetpea/chiaki-ng.git rp/chiaki-ng
          (cd rp/chiaki-ng && git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete)
          git clone --depth 1 --branch v2.28.9 https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/mbedtls"
          sudo apt-get install -y protobuf-compiler python3-protobuf >/dev/null
          echo "HSRP_MBEDTLS_DIR=$RUNNER_TEMP/mbedtls" >> "$GITHUB_ENV"
          echo "HSRP_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"

      - name: The phone page (same as the Windows app, phone design)
        run: python3 pc/sync_web.py && python3 phone/build_app.py

      - name: Build APK
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
          HSTV_STORE_PASSWORD: ${{ secrets.HSTV_STORE_PASSWORD }}
          HSTV_KEY_ALIAS: ${{ secrets.HSTV_KEY_ALIAS }}
          HSTV_KEY_PASSWORD: ${{ secrets.HSTV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :phone:assembleSiteRelease :phone:bundlePlayRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk hong-sub-tv.apk
          cp phone/build/outputs/apk/site/release/phone-site-release.apk hong-sub-android.apk
          cp phone/build/outputs/bundle/playRelease/phone-play-release.aab hong-sub-android-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            hong-sub-tv.apk
            hong-sub-android.apk
            hong-sub-android-play.aab

  webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the LG webOS app
        run: |
          V=1.0.${{ github.run_number }}
          jq --arg v "$V" '.version=$v' webos/appinfo.json > /tmp/a.json && mv /tmp/a.json webos/appinfo.json
          sed -i "s/var VERSION='[^']*'/var VERSION='$V'/" webos/index.html
          npx --yes -p @webos-tools/cli ares-package webos -o out
          cp out/*.ipk hong-sub-lg.ipk
          ls -la hong-sub-lg.ipk
      - name: Build the Samsung (Tizen) app from the LG one
        run: |
          V=1.0.${{ github.run_number }}
          python3 tizen/build.py "$V"
          (cd tizen/app && zip -qr ../../hong-sub-samsung.wgt .)
          cp tizen/app/app.html samsung-app.html
          ls -la hong-sub-samsung.wgt
      - uses: actions/upload-artifact@v4
        with:
          name: webos
          path: |
            hong-sub-lg.ipk
            hong-sub-samsung.wgt
            samsung-app.html

  rp-helper:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys1
        continue-on-error: true
        with:
          msystem: mingw64
          update: false
          install: git
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p openssl:p json-c:p miniupnpc:p libevent:p python:p python-protobuf:p

      - uses: msys2/setup-msys2@v2
        if: steps.msys1.outcome == 'failure'
        id: msys2b
        continue-on-error: true
        with:
          msystem: mingw64
          update: false
          install: git
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p openssl:p json-c:p miniupnpc:p libevent:p python:p python-protobuf:p

      - uses: msys2/setup-msys2@v2
        if: steps.msys1.outcome == 'failure' && steps.msys2b.outcome == 'failure'
        with:
          msystem: mingw64
          update: false
          install: git
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p openssl:p json-c:p miniupnpc:p libevent:p python:p python-protobuf:p

      - name: Get chiaki-ng source (AGPL-3.0)
        run: |
          TAG=v1.10.1
          echo "chiaki-ng $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/streetpea/chiaki-ng.git rp/chiaki-ng
          cd rp/chiaki-ng && git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
          echo "$TAG" > ../CHIAKI_TAG

      - name: Build hongsub-rp
        run: |
          cmake -S rp -B rp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build rp/build --target hongsub-rp
          mkdir -p out
          cp rp/build/hongsub-rp.exe out/
          ldd out/hongsub-rp.exe | grep -i '/mingw64/' | awk '{print $3}' | while read -r f; do cp "$f" out/ ; done
          ls -la out
          ./out/hongsub-rp.exe version
          cp rp/chiaki-ng/COPYING out/CHIAKI-NG-LICENSE-AGPL3.txt
          printf 'hongsub-rp: cau noi Remote Play cua Hong Sub, dung chiaki-lib cua chiaki-ng %s (GNU AGPL-3.0).\r\nMa nguon chiaki-ng: https://github.com/streetpea/chiaki-ng\r\nMa nguon hongsub-rp: https://github.com/nvhnhi96-ui/hong-sub-tv/tree/main/rp\r\n' "$(cat rp/CHIAKI_TAG)" > out/NGUON-MA-REMOTE-PLAY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rp-helper
          path: out

  windows:
    needs: [ rp-helper ]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Add the on-device text reader
        run: python sync_web.py

      - uses: actions/download-artifact@v4
        with:
          name: rp-helper
          path: pc/rp

      - name: Get Vietnamese voice (Piper)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # --- Piper (MIT) + Vietnamese voice VAIS-1000 (CC BY 4.0) ---
          Invoke-WebRequest https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile "$env:RUNNER_TEMP\piper.zip"
          Expand-Archive "$env:RUNNER_TEMP\piper.zip" -DestinationPath voices -Force
          $hf = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium'
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx" -OutFile voices\vi_VN-vais1000-medium.onnx
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx.json" -OutFile voices\vi_VN-vais1000-medium.onnx.json
          try { Invoke-WebRequest https://raw.githubusercontent.com/rhasspy/piper/master/LICENSE.md -OutFile voices\PIPER-LICENSE-MIT.txt } catch { }
          "Giọng đọc: Piper (MIT, https://github.com/rhasspy/piper)`r`nGiọng tiếng Việt: vi_VN-vais1000-medium, huấn luyện từ VAIS-1000 Vietnamese Speech Synthesis Corpus, giấy phép CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).`r`nNguồn: https://huggingface.co/rhasspy/piper-voices" | Out-File voices\NGUON-GIONG-DOC.txt -Encoding utf8
          Get-ChildItem voices | ForEach-Object { Write-Host "voice file: $($_.Name) $($_.Length)" }

      - name: Set version
        run: npm pkg set version=1.0.${{ github.run_number }}

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Self test on Windows
        shell: pwsh
        env:
          HS_SELFTEST: '1'
          HS_TEST_AIV: '1'
          HS_SELFTEST_OUT: ${{ runner.temp }}\selftest
        run: |
          $exe = Get-ChildItem dist\win-unpacked -Filter HongSub.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(480000)) { Stop-Process -Id $p.Id -Force; Write-Host 'selftest timed out' }
          Get-Content "$env:HS_SELFTEST_OUT\log.txt" -ErrorAction SilentlyContinue
          $pic = Select-String -Path "$env:HS_SELFTEST_OUT\log.txt" -Pattern '^picture test (.*)$' | Select-Object -Last 1
          if (-not $pic) { Write-Host 'PS picture test missing'; exit 1 }
          $j = $pic.Matches[0].Groups[1].Value | ConvertFrom-Json
          if ($j.decodedFrames -lt 5 -or $j.split -lt 1) { Write-Host "PS picture test failed: $($pic.Line)"; exit 1 }
          Write-Host "PS picture test ok: $($j.decodedFrames) frames, settings sent apart $($j.split)x"
          Get-Content "$env:HS_SELFTEST_OUT\result.json" -ErrorAction SilentlyContinue

      - name: Save self test pictures to branch selftest-output
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}\selftest
        run: |
          $repo = '${{ github.repository }}'
          $exists = gh api "repos/$repo/branches/selftest-output" 2>$null
          if (-not $exists) {
            $sha = gh api "repos/$repo/git/ref/heads/main" --jq .object.sha
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/selftest-output -f sha=$sha | Out-Null
          }
          Get-ChildItem $env:OUT -File | ForEach-Object {
            $name = $_.Name
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            $old = gh api "repos/$repo/contents/selftest/$($name)?ref=selftest-output" --jq .sha 2>$null
            $body = @{ message = "selftest $name"; content = $b64; branch = 'selftest-output' }
            if ($old) { $body.sha = $old }
            $body | ConvertTo-Json | gh api -X PUT "repos/$repo/contents/selftest/$name" --input - | Out-Null
            Write-Host "saved $name"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: ${{ runner.temp }}\selftest

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pc/dist/hong-sub-pc.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Add the on-device text reader
        run: python3 sync_web.py
      - name: Set version
        run: |
          npm pkg set version=1.0.${{ github.run_number }}
          mkdir -p rp voices
      - name: Build the Mac app (Apple chip and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # the app's file name in plain letters: macOS finds the helper apps by name, and the accent in "Hóng" broke that
        run: npx electron-builder --mac dir --arm64 --x64 --publish never -c.productName='Hong Sub' -c.mac.extendInfo.CFBundleDisplayName='Hóng Sub'
      - name: Sign for this Mac only and pack the disk images
        run: |
          set -e
          ls dist
          pack() {
            APP=$(ls -d "$1"/*.app | head -1)
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep "$APP"
            rm -rf stage && mkdir stage && cp -R "$APP" stage/ && ln -s /Applications stage/Applications
            hdiutil create -volname "Hóng Sub" -srcfolder stage -ov -format UDZO "$2"
          }
          pack dist/mac-arm64 hong-sub-mac-apple.dmg
          pack dist/mac hong-sub-mac-intel.dmg
          ls -la *.dmg
      - name: Self test on the Mac
        env:
          HS_SELFTEST: '1'
          HS_SELFTEST_OUT: ${{ runner.temp }}/selftest
        run: |
          APP=$(ls -d dist/mac-arm64/*.app | head -1)
          BIN=$(ls "$APP"/Contents/MacOS/* | head -1)
          "$BIN" --selftest > /tmp/run.txt 2>&1 & PID=$!
          for i in $(seq 1 48); do kill -0 $PID 2>/dev/null || break; sleep 5; done
          kill $PID 2>/dev/null || true
          grep -E '^(state-visible|voices|relay test|lg test)' "$HS_SELFTEST_OUT/log.txt" | cut -c1-200 || true
          grep -q '^state-visible' "$HS_SELFTEST_OUT/log.txt" || { echo "Mac app did not start"; tail -40 /tmp/run.txt; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            pc/hong-sub-mac-apple.dmg
            pc/hong-sub-mac-intel.dmg

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools, chiaki-ng and Mbed TLS for the Remote Play core
        run: |
          set -e
          brew install xcodegen protobuf >/dev/null
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q protobuf playwright
          echo "HSRP_PYTHON=$RUNNER_TEMP/py/bin/python3" >> "$GITHUB_ENV"
          git clone --depth 1 --branch v1.10.1 https://github.com/streetpea/chiaki-ng.git rp/chiaki-ng
          (cd rp/chiaki-ng && git submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete)
          git clone --depth 1 --branch v2.28.9 https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/mbedtls"
          echo "HSRP_MBEDTLS_DIR=$RUNNER_TEMP/mbedtls" >> "$GITHUB_ENV"
      - name: The page (same as the Android app)
        run: python3 pc/sync_web.py && python3 phone/build_app.py && cp phone/src/main/assets/app.html ios/web/index.html
      - name: Remote Play core for iPhone
        working-directory: ios
        run: ./build-rp.sh iphoneos
      - name: Build the iPhone app (not signed)
        working-directory: ios
        run: |
          set -e
          xcodegen generate
          xcodebuild -quiet -project HongSub.xcodeproj -scheme HongSub -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=build/Build/Products/Release-iphoneos/HongSub.app
          ls -la "$APP" "$APP/web"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr ../hong-sub-ios.ipa Payload
          ls -la ../hong-sub-ios.ipa
      - name: Check the page in WebKit with the core (as on the iPhone)
        continue-on-error: true
        run: |
          set -e
          cmake -S rp/mobile -B rp/build-mac -DHSRP_TEST=ON -DCMAKE_BUILD_TYPE=Release -DCHIAKI_DIR="$PWD/rp/chiaki-ng" \
            -DFETCHCONTENT_SOURCE_DIR_MBEDTLS="$HSRP_MBEDTLS_DIR" -DPython3_EXECUTABLE="$HSRP_PYTHON" >/dev/null
          cmake --build rp/build-mac --target hsrp-test -j 4 >/dev/null
          "$RUNNER_TEMP/py/bin/python3" -m playwright install webkit >/dev/null
          cd ios/test && "$RUNNER_TEMP/py/bin/python3" webkit_test.py "$GITHUB_WORKSPACE/rp/build-mac/hsrp-test" "$GITHUB_WORKSPACE/ios/web" "$GITHUB_WORKSPACE/ios/test/sample.h264"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            hong-sub-ios.ipa
            ios/test/webkit-ios.png

  release:
    needs: [ android, windows, webos, mac, ios ]
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.webos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hóng Sub 1.0.${{ github.run_number }}
          body: |
            Bản tự động.
            - hong-sub-pc.exe: phần mềm cho máy tính Windows 10/11.
            - hong-sub-tv.apk: Android TV / Google TV (cài bằng Downloader).
            - hong-sub-android.apk: app Hóng Sub cho điện thoại Android (đủ chức năng như bản Windows): chơi PS5/PS4 ngay trong app (không cần app của Sony), PS Remote Play của Sony, hoặc camera chĩa vào TV.
            - hong-sub-ios.ipa: app Hóng Sub cho iPhone/iPad (iOS 16.4 trở lên), chưa ký: cài bằng Sideloadly hoặc AltStore với Apple ID.
            - hong-sub-android-play.aab: cùng app đó, gói để nộp lên Google Play.
            - hong-sub-lg.ipk: TV LG (webOS), cài bằng Developer Mode.
            - hong-sub-samsung.wgt: TV Samsung (Tizen), cài bằng Tizen Studio với chứng chỉ Samsung.
            - hong-sub-mac-apple.dmg / hong-sub-mac-intel.dmg: phần mềm cho máy Mac (chip Apple M1 trở lên / chip Intel), dùng với app PS Remote Play của Sony.
          files: |
            out/hong-sub-pc.exe
            out/hong-sub-tv.apk
            out/hong-sub-android.apk
            out/hong-sub-android-play.aab
            out/hong-sub-lg.ipk
            out/hong-sub-samsung.wgt
            out/hong-sub-mac-apple.dmg
            out/hong-sub-mac-intel.dmg
            out/hong-sub-ios.ipa
          fail_on_unmatched_files: false
          make_latest: true

      # Samsung TVs open the newest app page from the tv-live branch (the installed app is only a fallback),
      # so a new version reaches the TV without reinstalling
      - name: Publish the Samsung TV app page
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          V: 1.0.${{ github.run_number }}
        run: |
          set -e
          B=tv-live
          if ! gh api "repos/$R/branches/$B" >/dev/null 2>&1; then
            gh api "repos/$R/git/refs" -f ref="refs/heads/$B" -f sha="$GITHUB_SHA" >/dev/null
          fi
          printf '%s\n' "$V" > /tmp/version.txt
          put() {
            OLD=$(gh api "repos/$R/contents/samsung/$2?ref=$B" -q .sha 2>/dev/null || true)
            python3 -c "import base64,json,sys; d={'message':'Samsung TV app '+sys.argv[2],'branch':'tv-live','content':base64.b64encode(open(sys.argv[1],'rb').read()).decode()}; import re; o=sys.argv[3].strip(); d.update({'sha':o} if re.fullmatch('[0-9a-f]{40}',o) else {}); json.dump(d,open('/tmp/put.json','w'))" "$1" "$V" "$OLD"
            gh api -X PUT "repos/$R/contents/samsung/$2" --input /tmp/put.json >/dev/null
          }
          put out/samsung-app.html app.html
          put /tmp/version.txt version.txt
          echo "published $V"
