name: Build Hong Sub

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'presets/**', 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key (if configured)
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
        if: env.HSTV_KEYSTORE_B64 != ''
        run: echo "$HSTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hstv.jks"

      - name: Build APK
        env:
          HSTV_KEYSTORE_B64: ${{ secrets.HSTV_KEYSTORE_B64 }}
          HSTV_STORE_PASSWORD: ${{ secrets.HSTV_STORE_PASSWORD }}
          HSTV_KEY_ALIAS: ${{ secrets.HSTV_KEY_ALIAS }}
          HSTV_KEY_PASSWORD: ${{ secrets.HSTV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :phone:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk hong-sub-tv.apk
          cp phone/build/outputs/apk/release/phone-release.apk hong-sub-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            hong-sub-tv.apk
            hong-sub-android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Get Remote Play (chiaki-ng, AGPL-3.0) and Vietnamese voice (Piper)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # --- chiaki-ng: unmodified official portable build ---
          $rel = gh api repos/streetpea/chiaki-ng/releases/latest | ConvertFrom-Json
          Write-Host "chiaki-ng $($rel.tag_name)"
          $rel.assets | ForEach-Object { Write-Host "  asset: $($_.name)" }
          $zips = $rel.assets | Where-Object { $_.name -match '(?i)win' -and $_.name -match '(?i)\.zip$' -and $_.name -notmatch '(?i)arm' }
          $a = $zips | Where-Object { $_.name -match '(?i)portable' } | Select-Object -First 1
          if (-not $a) { $a = $zips | Select-Object -First 1 }
          if (-not $a) { throw 'no Windows zip in chiaki-ng release' }
          Write-Host "using $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile "$env:RUNNER_TEMP\rp.zip"
          Expand-Archive "$env:RUNNER_TEMP\rp.zip" -DestinationPath remoteplay -Force
          $exe = Get-ChildItem remoteplay -Recurse -Include chiaki.exe, chiaki-ng.exe | Select-Object -First 1
          if (-not $exe) { Get-ChildItem remoteplay -Recurse | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }; throw 'chiaki exe not found' }
          Write-Host "exe: $($exe.FullName)"
          foreach ($f in 'COPYING','LICENSE','LICENSE.txt') { try { Invoke-WebRequest "https://raw.githubusercontent.com/streetpea/chiaki-ng/main/$f" -OutFile remoteplay\CHIAKI-NG-LICENSE-AGPL3.txt; break } catch { } }
          "chiaki-ng $($rel.tag_name) - PlayStation Remote Play client mã nguồn mở, không thuộc Sony.`r`nMã nguồn: https://github.com/streetpea/chiaki-ng/releases/tag/$($rel.tag_name)`r`nGiấy phép: GNU AGPL-3.0 (xem CHIAKI-NG-LICENSE-AGPL3.txt).`r`nHóng Sub đóng gói nguyên bản, không sửa đổi." | Out-File remoteplay\NGUON-CHIAKI-NG.txt -Encoding utf8
          # --- Piper (MIT) + Vietnamese voice VAIS-1000 (CC BY 4.0) ---
          Invoke-WebRequest https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile "$env:RUNNER_TEMP\piper.zip"
          Expand-Archive "$env:RUNNER_TEMP\piper.zip" -DestinationPath voices -Force
          $hf = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/vi/vi_VN/vais1000/medium'
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx" -OutFile voices\vi_VN-vais1000-medium.onnx
          Invoke-WebRequest "$hf/vi_VN-vais1000-medium.onnx.json" -OutFile voices\vi_VN-vais1000-medium.onnx.json
          try { Invoke-WebRequest https://raw.githubusercontent.com/rhasspy/piper/master/LICENSE.md -OutFile voices\PIPER-LICENSE-MIT.txt } catch { }
          "Giọng đọc: Piper (MIT, https://github.com/rhasspy/piper)`r`nGiọng tiếng Việt: vi_VN-vais1000-medium, huấn luyện từ VAIS-1000 Vietnamese Speech Synthesis Corpus, giấy phép CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).`r`nNguồn: https://huggingface.co/rhasspy/piper-voices" | Out-File voices\NGUON-GIONG-DOC.txt -Encoding utf8
          Get-ChildItem voices | ForEach-Object { Write-Host "voice file: $($_.Name) $($_.Length)" }

      - name: Set version
        run: npm pkg set version=1.0.${{ github.run_number }}

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Test-only software OpenGL for Remote Play (build machine has no GPU)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/pal1000/mesa-dist-win/releases/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          if (-not $a) { $a = $rel.assets | Where-Object { $_.name -match 'release.*\.7z$' } | Select-Object -First 1 }
          Write-Host "mesa $($rel.tag_name) $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          7z x "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          $dst = (Get-ChildItem dist\win-unpacked\resources\remoteplay -Recurse -Filter chiaki.exe | Select-Object -First 1).DirectoryName
          Get-ChildItem "$env:RUNNER_TEMP\mesa\x64" -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $dst -Force; Write-Host "copied $($_.Name)" }
          Rename-Item (Join-Path $dst 'opengl32.dll') 'opengl32sw.dll' -Force

      - name: Self test on Windows
        shell: pwsh
        env:
          HS_SELFTEST: '1'
          HS_SELFTEST_OUT: ${{ runner.temp }}\selftest
        run: |
          $exe = Get-ChildItem dist\win-unpacked -Filter HongSub.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host 'selftest timed out' }
          Get-Content "$env:HS_SELFTEST_OUT\log.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:HS_SELFTEST_OUT\result.json" -ErrorAction SilentlyContinue

      - name: Save self test pictures to branch selftest-output
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}\selftest
        run: |
          $repo = '${{ github.repository }}'
          $exists = gh api "repos/$repo/branches/selftest-output" 2>$null
          if (-not $exists) {
            $sha = gh api "repos/$repo/git/ref/heads/main" --jq .object.sha
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/selftest-output -f sha=$sha | Out-Null
          }
          Get-ChildItem $env:OUT -File | ForEach-Object {
            $name = $_.Name
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            $old = gh api "repos/$repo/contents/selftest/$($name)?ref=selftest-output" --jq .sha 2>$null
            $body = @{ message = "selftest $name"; content = $b64; branch = 'selftest-output' }
            if ($old) { $body.sha = $old }
            $body | ConvertTo-Json | gh api -X PUT "repos/$repo/contents/selftest/$name" --input - | Out-Null
            Write-Host "saved $name"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: ${{ runner.temp }}\selftest

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pc/dist/hong-sub-pc.exe

  release:
    needs: [ android, windows ]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hóng Sub 1.0.${{ github.run_number }}
          body: |
            Bản tự động.
            - hong-sub-pc.exe: phần mềm cho máy tính Windows 10/11.
            - hong-sub-tv.apk: Android TV / Google TV (cài bằng Downloader).
            - hong-sub-android.apk: điện thoại Android, dùng kèm app PS Remote Play.
          files: |
            out/hong-sub-pc.exe
            out/hong-sub-tv.apk
            out/hong-sub-android.apk
          make_latest: true
